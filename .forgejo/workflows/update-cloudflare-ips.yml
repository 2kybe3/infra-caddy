name: Update Cloudflare IPs

on:
  schedule:
    - cron: "0 0 * * 0"
      timezone: Europe/Berlin
  workflow_dispatch:

jobs:
  update-ips:
    runs-on: self-hosted
    container:
      image: ghcr.io/catthehacker/ubuntu:act-latest@sha256:2f22a801c486881e278401813586faf73fac7dd1d016cbe9e01122ef14a57850

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: https://github.com/cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6

      - name: Generate assets/cloudflare/ips.txt
        run: |
          mkdir -vp assets/cloudflare
          nix run .#cloudflare-ips > assets/cloudflare/ips.txt

      - name: Commit and push if updated
        run: |
          git config user.name "cloudflare-ips[bot]"
          git config user.email "noreply@noreply.noreply"
          if ! git diff --quiet assets/cloudflare/ips.txt; then
            git add assets/cloudflare/ips.txt
            git commit -m "cloudflare-ips: update"
            git push
          else
            echo "No changes to commit."
          fi
